apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iot-argocd-development
  namespace: argocd
spec:
  project: development
  source:
    repoURL: https://github.com/mtourham/iot-wilplayground.git
    targetRevision: HEAD
    path: manifest
  destination:
    server:  https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: false
      selfHeal: true